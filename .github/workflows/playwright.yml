# .github/workflows/playwright.yml
name: Playwright Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 5" # Runs every Friday at 3:00 PM IST

jobs:
  test:
    environment: Prod Env   # 👈 REQUIRED (use your actual environment name)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      NODE_ENV: ${{ secrets.NODE_ENV }}
      BASE_URL: ${{ secrets.BASE_URL }}
      USER: ${{ secrets.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test tests/emportal_TimeSheetSubmitE2E.spec.ts --reporter=html --output=playwright-report

      - name: Upload Playwright Report on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright Report on Success
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
